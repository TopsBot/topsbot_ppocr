# PP-OCR Models Manifest
# Defines which .nb models are required and where to download them

install_dir: "~/topsbot/models"

# Aliyun Drive share URL containing the model ZIP archive
# Archive contains: ppocr_det_int16.nb and ppocr_rec_float16.nb (plus config files)
models_zip_url: "https://bj25486.apps.aliyunfile.com/disk/s/xkBY1fdLsq9?domainId=bj25486"

# Dataset directory for dictionary and samples
dataset_dir: "~/topsbot/dataset/ppocr"

# Dictionary file (downloaded separately from GitHub if not in ZIP)
dictionary:
  name: "ppocr_keys_v1.txt"
  fallback_url: "https://raw.githubusercontent.com/PaddlePaddle/PaddleOCR/main/ppocr/utils/ppocr_keys_v1.txt"

# Required .nb model files (must exist in the ZIP archive)
required_models:
  - ppocr_det_int16.nb
  - ppocr_rec_float16.nb

# JSON config files (may contain model input/output parameters)
config_files:
  - ppocr_config_det_int16.json
  - ppocr_config_rec_float16.json

# Optional model files (different quantization levels or formats)
optional_models:
  - ppocrv4_det.onnx
  - ppocrv4_rec.onnx
  - datasets_det.txt
  - datasets_rec.txt

